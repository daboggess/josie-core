<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Josie Creative Studio Composite</title>
  <style>
{{style_css}}
  </style>
</head>
<body>
  <div class="canvas {{aspect_ratio}}">
    <img class="bg-image" src="{{bg_image_src}}" alt="Background">
    <div class="overlay-gradient"></div>
    <div class="content-layer">
      {{brand_section}}

      <div class="card-wrapper">
        <div class="content-card">
          <h1 class="headline">{{headline}}</h1>
          <p class="subheadline">{{subheadline}}</p>
          {{cta_section}}
        </div>
      </div>
    </div>
  </div>
</body>
</html>
